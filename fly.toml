# fly.toml for Racksephnox Laravel Application

app = "racksephnox"
primary_region = "jnb"

[build]
  [build.args]
    NODE_VERSION = "18"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stack"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512

[deploy]
  release_command = "php artisan migrate --force"

[ mounts ]
  source = "storage"
  destination = "/app/storage"
